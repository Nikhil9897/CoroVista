[project]
name = "corovista"
version = "0.1.0"
description = "CoroVista - Cardiovascular Risk Visualization & Vessel-Specific Stenosis Prediction System"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
    { name = "CoroVista Team" }
]
# Compatible bounded dependency constraints aligned with the verified research
# environment (Python 3.11.18, scikit-learn 1.7.2, xgboost 3.2.0, numpy 2.4.6,
# pandas 3.0.6, scipy 1.17.1, shap 0.51.0) to prevent silent cross-major shifts
# (e.g., scikit-learn SimpleImputer/metrics API changes).
dependencies = [
    "pandas>=2.2.0,<3.1.0",
    "numpy>=2.0.0,<2.5.0",
    "scipy>=1.14.0,<1.18.0",
    "openpyxl>=3.1.0,<3.2.0",
    "scikit-learn>=1.7.0,<1.8.0",
    "xgboost>=3.0.0,<3.3.0",
    "shap>=0.50.0,<0.52.0",
    "joblib>=1.4.0,<1.7.0",
    "fastapi>=0.115.0,<0.145.0",
    "uvicorn>=0.30.0,<0.56.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "matplotlib>=3.9.0,<3.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.2.0",
    "ruff>=0.14.0,<0.18.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = [".", "src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
